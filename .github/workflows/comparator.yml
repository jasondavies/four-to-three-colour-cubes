# Full replay is separate from push/PR checks so development pushes cannot cancel it.
# Use the manual ref input to check an exact release commit.
name: Comparator

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA, tag, or branch to verify (blank uses the workflow revision)"
        required: false
        type: string
        default: ''

permissions:
  contents: read

# Preserve the active replay; a later request waits instead of interrupting it.
concurrency:
  group: comparator-${{ github.ref }}
  cancel-in-progress: false

env:
  ELAN_VERSION: v4.2.4
  ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Record checked revision
        id: revision
        run: |
          checked_sha=$(git rev-parse HEAD)
          printf 'sha=%s\n' "$checked_sha" >> "$GITHUB_OUTPUT"
          printf 'Checked commit: `%s`\n' "$checked_sha" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Install elan
        run: |
          installer_dir=$(mktemp -d)
          trap 'rm -rf "$installer_dir"' EXIT
          curl -fsSL --retry 3 "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz" -o "$installer_dir/elan.tar.gz"
          echo "$ELAN_SHA256  $installer_dir/elan.tar.gz" | sha256sum --check --strict
          tar -xzf "$installer_dir/elan.tar.gz" -C "$installer_dir"
          "$installer_dir/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore project build
        id: restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .lake/build
          key: lake-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ steps.revision.outputs.sha }}
          restore-keys: lake-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Install metadata checker and comparator sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # Local tests exceeded 16 GB with two heavy RawChecks blocks in parallel.
      - name: Build raw catalogue checks one at a time
        timeout-minutes: 120
        env:
          LEAN_NUM_THREADS: "1"
        run: lake build ThreeColour.RawChecks
      - name: Check
        env:
          LEAN_NUM_THREADS: "1"
        run: bash scripts/check.sh
      # Save before replay so a timeout does not discard the completed build.
      - name: Save project build
        if: always() && steps.restore.outcome == 'success' && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .lake/build
          key: lake-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ steps.revision.outputs.sha }}
      - name: Compare statements and replay all three kernels
        timeout-minutes: 180
        env:
          CON_RON_JOBS: "1"
        run: make comparator
      - name: Record replay result
        if: success()
        run: |
          printf 'Result: all three kernels accepted the solution.\n' >> "$GITHUB_STEP_SUMMARY"
