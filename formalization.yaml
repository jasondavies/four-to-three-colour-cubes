      No six-colour classification theorem is imported.
status:
  scope: >-
    Sharp threshold 29, all larger collections, full classification at size 28,
    reflection of the two obstructions, source and target catalogue coverage,
    and source orbit uniqueness. Transport theorems connect canonical
    inventories to arbitrary indexed face colourings. Threshold
    and sharpness statements without source or target catalogues require
    exactly four source colours, exactly three target colours, distinct
    copies and geometric proper rotations.
    No priority claim or general five-colour threshold is formalised.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
