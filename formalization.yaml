status:
  scope: >-
    Sharp frame and complete-box thresholds for every ordered cuboid with
    sides at least two, and exact criteria for needing no spare sources.
    Cube, rod and strip thresholds are corollaries in one exposed-face model.
    The cube stability theorem characterises all failures of size at least
    14n for n >= 3. Explicit bijections give the two binomial counts, and the
    largest and next-largest failures are classified for every n >= 2.
    Catalogue completeness, uniqueness, proper-rotation matching, target
    restrictions, and transport to arbitrary physical source families are proved.
    The Mathlib-only comparator challenge contains 58 statements, including
    the cuboid endpoints and their specialisations. Public results have
    standard-axiom guards. General cuboid extremal inventories are not classified.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
