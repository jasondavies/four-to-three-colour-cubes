version: "v0.4"
project:
  name: "Three-colour solutions from four-colour cubes"
  description: >-
    For every side length n >= 2, the sharp threshold for a three-colour frame
    from four-colour source cubes is 16n-3. Exactly two collections of size
    16n-4 fail: 4n-1 copies of each of four T varieties in one orientation class,
    or their reflections. Exactly 32 collections of size 16n-5 fail for every n >= 2,
    including 24 inclusion-maximal pair cases. For n >= 3, failures of size
    at least 14n are exactly the pure ordinary collections with every bucket
    at most 4n-1. A bijective parametrisation counts all failures and all
    inclusion-maximal failures in this band by binomial coefficients.
    Forty Q/D/U targets suffice for
    guaranteed frames when n >= 3. The sharp complete-cube threshold is max(n^3,16n-3).
    Arbitrary indexed face colourings, geometric proper rotations, and distinct
    physical copies are formalised. The original n=2 threshold of 29 and its
    restricted-target corollary are retained. Internal faces are unrestricted.
  authors: ["Jason Davies"]
  responsible_maintainers: ["Jason Davies"]
  license: "Apache-2.0"
