version: "v0.4"
project:
  name: "Three-colour cuboids from four-colour cubes"
  description: >-
    Sharp thresholds for assembling cuboids with monochromatic exterior faces
    using exactly three colours from source cubes using all four colours of
    a fixed palette. For ordered integer sides 2 <= a <= b <= c,
    F=max(16a-3,4(a+b+c)-16,floor((24c-1)/5)) is the frame threshold and
    G=max(abc,16a-3,floor((24c-1)/5)) the complete-cuboid threshold.
    Both thresholds and the exact conditions for needing no spare sources
    are formalised for arbitrary indexed physical families, distinct copies
    and proper rotations. Internal faces are unrestricted.
    For cubic frames, F(n,n,n)=16n-3. Exactly two collections of size 16n-4
    fail, and exactly 32 of size 16n-5 fail, including 24 inclusion-maximal
    pair cases. For n >= 3, failures of size at least 14n are exactly the
    ordinary collections in one orientation class with every bucket at most
    4n-1; explicit bijections give the two binomial counts. Forty Q/D/U
    targets suffice for guaranteed cubic frames when n >= 3. Cube, rod and strip thresholds specialise the cuboid theorem in one position model.
  authors: ["Jason Davies"]
  responsible_maintainers: ["Jason Davies"]
  license: "Apache-2.0"
