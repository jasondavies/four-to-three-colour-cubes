fidelity:
  divergences: >-
    Cubes are represented by their six discrete coordinate-face colours, with
    proper rotations represented by determinant-positive signed-axis permutations.
    Collections allow arbitrary repeated varieties. Only exterior faces match.
    The Lean proof uses a related counting argument with finite Hall certificates
    for the constructions. Its n=2 proof treats checkerboards and the smaller ordinary
    class separately; the written proof combines them as minority cubes.
    The new 27-cube purity proof and the frame proof combine them; the frame
    proof is symbolic in k=n-2. Frame positions
    consist of eight corners and twelve groups of k edge positions; complete
    cube positions additionally include six groups of k^2 face interiors and
    k^3 interior positions. The cardinality and frame-completion theorem are proved.
    The lower bound is checked against every target rather than formalising
    the written edge-count balance proof or the degree remark. Uniqueness up
    to colour permutation is a written corollary, without a separate formal
    colour-permutation theorem. The remark giving an upper bound of 28 when
    targets may use at most three colours is not formalised.
    The restricted-target corollary is formalised for arbitrary indexed families,
    with geometric definitions of Q, R and D, their catalogue coverage,
    target uniqueness and the counts 12, 12, 4 and 28 in total. Geometry
    checks cover 68 sources, 120 targets and all 4096 four-palette face assignments.
    The stability, near-extremal and forty-target extensions are checked library theorems,
    outside the original 35-statement comparator challenge. The near-extremal
    physical statement specifies rotation-class counts. The forty-target
    statement uses canonical target indices and physical proper-rotation
    placements for arbitrary source families. The thin checkerboard-cuboid
    observation is a written result with finite audit controls, not a Lean theorem.
review:
  status: "AI-reviewed; not independently reviewed by a human expert"
  reviewers:
    - "GPT-6-Astra (OpenAI), used through Codex: separate AI review of the earlier argument and formalisation"
    - "Claude Opus 5.5 (Anthropic; claude-opus-5-5): Claude Code reviews and tool runs in this repository, supplied by the author"
  notes: >-
    The original GPT-6-Astra review predates extraction into this package and
    the manuscript rewrites; it does not cover the current manuscript.
    Later Claude reviews contributed the mathematical simplifications listed
    above and identified comparator definition mismatches, corrected with a
    reviewer-supplied patch. An additional external review supplied by the author
    suggested the restricted-target corollary and revisions to the introduction,
    finite geometry, pair-support step and disclosure. The reviewer was not
    identified in the supplied text. Historical review notes remain in Git history.
    On November 2, 2026 the author supplied the frame-extension argument and
    complete-cube consequence, produced by GPT-6-Astra (OpenAI) through ChatGPT.
    Claude Opus 5.5 checked it independently, step by step and with finite
    computations (obstructions and one-cube extensions for n = 2 to 6, and
    perturbed and adversarial collections for n = 2 to 4); those scripts are not
    checked in. Codex also checked the argument, wrote the general Lean proofs,
    added a separate finite frame audit, and revised the manuscript. This does
    not imply that earlier external reviews covered the frame extension.
    On November 3, 2026 the author supplied the proposed 32-case near-extremal
    classification, forty-target reduction and checkerboard cuboid observation.
    Codex checked and integrated these arguments, formalised the first two,
    and added a separate C++ geometry audit. These additions have not received
    a separate human review or an extended comparator challenge.
    A further user-supplied review proposed the stability theorem and binomial
    counts. Codex checked and integrated that argument, formalised the criterion,
    parametrisation and inclusion-maximality, and extended the raw-geometry audit.
    Reproduce current checks with make check and
    make comparator. Push/PR CI runs make check; a separate manually triggered
    workflow runs all three comparator kernels and records the checked commit.
    A successful replay of the exact commit is required before release.
    CI and preflight logs identify the checked revision; no
    stale machine-specific validation logs are committed. The literature check
    on November 1, 2026 found no prior answer. Sources examined included BES
    (2018), Berkove and Schettler (2022), Johnson and Roldan (2024), and Beeler's
    survey, together with citation and title searches. Search coverage is
    incomplete. Rosenfeld's October 2026 article (pp. 78-82) was examined
    in full on November 3 using the supplied scan. It presents an eight-cube
    six-colour puzzle and does not state the four-to-three thresholds. No authors
    or editors were contacted. No priority, publication or Palomar acceptance
    is asserted.
