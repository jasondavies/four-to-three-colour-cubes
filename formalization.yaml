version: "v0.4"
project:
  name: "A sharp threshold for three-colour targets from four-colour cubes"
  description: >-
    Every multiset of 29 cubes using all four fixed face colours contains eight
    that form an exactly-three-colour target with monochromatic exterior faces.
    The bound is sharp, and the two labelled 28-cube obstruction multisets are
    classified and proved to be mirror images. Internal faces are unrestricted.
    A palette-independent corner–rotation lemma connects cyclic corner types to
    physical face matching. The formalisation checks distinct copy use, catalogue
    coverage and source uniqueness, and uses a related counting argument with finite
    kernel-checked Hall certificates for sufficient constructions.
  authors: ["Jason Davies"]
  responsible_maintainers: ["Jason Davies"]
  license: "Apache-2.0"
repository:
  role: substantive-development
classification:
  arxiv: ["math.CO", "cs.LO"]
  msc2020: ["05C70", "68V15", "00A08"]
