status:
  scope: >-
    Sharp frame threshold 16n-3 for every n >= 2, classification of the two
    size-(16n-4) obstructions and their reflection, sharp complete-cube threshold
    max(n^3,16n-3), and the n >= 4 volume-only consequence. Source and target
    catalogue coverage and uniqueness, corner and edge matching by proper
    rotations, and transport to arbitrary indexed face colourings are checked.
    The n=2 restricted-target corollary and its count of 28 targets remain proved.
    The complete size-(16n-5) band is classified into 32 templates; the 24 pair
    cases are inclusion-maximal. Forty Q/D/U targets suffice when n >= 3.
    For n >= 3, all failures of size at least 14n are characterised by purity
    and bucket capacities. At size 16n-4-d, for 0 <= d <= 2n-4, the exact
    counts are 2*choose(d+15,15) failures and 2*choose(d+11,11) inclusion-maximal
    failures, proved by explicit bijections and stars and bars.
    No priority claim, classification below this band, higher-dimensional theorem,
    or general five-colour threshold is formalised.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
