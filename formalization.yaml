fidelity:
  divergences: >-
    Cubes are represented by their six discrete coordinate-face colours, with
    proper rotations represented by determinant-positive signed-axis permutations.
    Collections allow arbitrary repeated varieties. Only exterior faces match.
    The Lean proof uses a related counting argument with finite Hall certificates
    for the constructions. Its n=2 proof treats checkerboards and the smaller ordinary
    class separately; the written proof combines them as minority cubes.
    The 27-cube purity proof and the frame stability proof combine them; the frame
    proof is symbolic in k=n-2. Frame positions
    consist of eight corners and twelve groups of k edge positions; complete
    cube positions additionally include six groups of k^2 face interiors and
    k^3 interior positions. The cardinality and frame-completion theorem are proved.
    The lower bound is checked against every target rather than formalising
    the written edge-count balance proof or the degree remark. Uniqueness up
    to colour permutation is a written corollary, without a separate formal
    colour-permutation theorem. The remark giving an upper bound of 28 when
    targets may use at most three colours is not formalised.
    The restricted-target corollary is formalised for arbitrary indexed families,
    with geometric definitions of Q, R and D, their catalogue coverage,
    target uniqueness and the counts 12, 12, 4 and 28 in total. Geometry
    checks cover 68 sources, 120 targets and all 4096 four-palette face assignments.
    The stability, near-extremal and forty-target extensions are in the
    comparator challenge. Failures are counted as vectors of rotation-class
    multiplicities, with FrameFails asserting that some physical family with
    those counts has no frame. The stability criterion uses tables of the two
    ordinary classes and four buckets; separate compared theorems identify
    them with BES's universal-corner orientation classes and corner-type
    buckets. The near-extremal classification specifies rotation-class
    counts by 32 explicit templates. The forty-target
    statement uses canonical target indices and physical proper-rotation
    placements for arbitrary source families. Cuboids use BoxDefs and BoxModel;
    cube positions are equal-sided specialisations. The cuboid thresholds and
    corollaries are included in the comparator challenge, whose definitions
    are restated from the library rather than independently conceived.
review:
  status: "AI-reviewed; not independently reviewed by a human expert"
  reviewers:
    - "GPT-6-Astra (OpenAI): mathematical and formalisation reviews"
    - "Claude Opus 5.5 (Anthropic): mathematical and formalisation reviews"
  notes: >-
    AI review and computational audits are not human refereeing. Reproduce the
    current source, metadata, geometry and Lean checks with make check, and the
    statement comparison and three-kernel replay with make comparator. The
    workflows record their checked revision; a successful replay of the exact
    submitted commit is required before release.
    The literature comparison examined BES (2018), Berkove and Schettler (2022),
    Johnson and Roldan (2024), Beeler's survey, and citation and title searches.
    Search coverage is incomplete. Rosenfeld's October 2026 article (pp. 78-82)
    was examined in full from a supplied scan: it presents an eight-cube
    six-colour puzzle and does not state the four-to-three thresholds.
    No authors or editors were contacted; no priority or Palomar acceptance
    is asserted.
