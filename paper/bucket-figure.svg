<svg xmlns="http://www.w3.org/2000/svg" width="560" height="450" viewBox="0 0 560 450" role="img" aria-labelledby="title description">
<title id="title">Counting colour-bucket memberships</title>
<desc id="description">A T cube belongs to one colour bucket, a P cube to two, and a checkerboard cube to none. In an unsolvable reduced collection, each of the four buckets contains at most seven cubes.</desc>
